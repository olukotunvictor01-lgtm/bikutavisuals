<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Session | BIKUTAVISUALS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
</head>
<body class="text-zinc-100 font-sans min-h-screen flex flex-col justify-between bg-zinc-950 bg-cover bg-center bg-no-repeat bg-fixed bg-blend-overlay"
      style="background-image: linear-gradient(to bottom, rgba(24, 24, 27, 0.45), rgba(24, 24, 27, 0.65)), url('{{ url_for('static', filename='IMG_1295.JPG') }}');">

    <nav class="animate__animated animate__fadeInDown border-b border-white/10 px-6 py-4 flex justify-between items-center bg-black/40 backdrop-blur-md sticky top-0 z-50">
        <h1 class="text-xl font-bold tracking-widest text-white drop-shadow-md">BIKUTAVISUALS</h1>
        <div class="space-x-6 text-sm font-medium tracking-wide">
            <a href="/" class="text-zinc-300 hover:text-white transition">About</a>
            <a href="/book" class="text-white border-b-2 border-white pb-1">Book a Session</a>
            <a href="/admin/bookings" class="text-zinc-400 hover:text-white transition">Admin Portal</a>
        </div>
    </nav>

    <main class="max-w-md mx-auto px-6 py-12 z-10 w-full my-auto">
        <div class="bg-gradient-to-br from-white/10 to-white/5 border border-white/20 rounded-3xl p-8 backdrop-blur-xl shadow-[0_8px_32px_0_rgba(0,0,0,0.37)] animate__animated animate__fadeInUp">
            <h2 class="text-2xl font-bold text-white mb-1 tracking-tight [text-shadow:_0_2px_4px_rgba(0,0,0,0.4)]">Reserve Your Date</h2>
            <p class="text-xs text-zinc-200/80 mb-6">Fill out the details below and I will get back to you within 24 hours.</p>
            
            <form action="/book" method="POST" class="space-y-4">
                <div>
                    <label class="block text-[10px] uppercase tracking-widest text-zinc-300 font-bold mb-1">Full Name</label>
                    <input type="text" name="name" required class="w-full bg-black/20 border border-white/10 rounded-xl px-4 py-2.5 text-white placeholder-zinc-400 focus:outline-none focus:border-white/40 focus:bg-black/40 backdrop-blur-sm transition text-sm">
                </div>
                <div>
                    <label class="block text-[10px] uppercase tracking-widest text-zinc-300 font-bold mb-1">Email Address</label>
                    <input type="email" name="email" required class="w-full bg-black/20 border border-white/10 rounded-xl px-4 py-2.5 text-white placeholder-zinc-400 focus:outline-none focus:border-white/40 focus:bg-black/40 backdrop-blur-sm transition text-sm">
                </div>
                <div>
                    <label class="block text-[10px] uppercase tracking-widest text-zinc-300 font-bold mb-1">Phone Number</label>
                    <input type="tel" name="phone" required class="w-full bg-black/20 border border-white/10 rounded-xl px-4 py-2.5 text-white placeholder-zinc-400 focus:outline-none focus:border-white/40 focus:bg-black/40 backdrop-blur-sm transition text-sm">
                </div>
                <div>
                    <label class="block text-[10px] uppercase tracking-widest text-zinc-300 font-bold mb-1">Session Type</label>
                    <select name="session_type" class="w-full bg-black/20 border border-white/10 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-white/40 focus:bg-black/40 backdrop-blur-sm transition text-sm">
                        <option value="Portrait" class="bg-zinc-900 text-white">Portrait Session</option>
                        <option value="Wedding" class="bg-zinc-900 text-white">Wedding / Elopement</option>
                        <option value="Event" class="bg-zinc-900 text-white">Event Coverage</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] uppercase tracking-widest text-zinc-300 font-bold mb-1">Desired Date</label>
                    <input type="date" name="date" required class="w-full bg-black/20 border border-white/10 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-white/40 focus:bg-black/40 backdrop-blur-sm transition text-sm">
                </div>
                <div>
                    <label class="block text-[10px] uppercase tracking-widest text-zinc-300 font-bold mb-1">Message / Vision (Optional)</label>
                    <textarea name="message" rows="2" class="w-full bg-black/20 border border-white/10 rounded-xl px-4 py-2.5 text-white placeholder-zinc-400 focus:outline-none focus:border-white/40 focus:bg-black/40 backdrop-blur-sm transition text-sm"></textarea>
                </div>
                
                <button type="submit" class="w-full bg-white/90 text-zinc-950 font-bold py-3.5 rounded-xl mt-6 hover:bg-white transition shadow-xl tracking-wide text-sm transform hover:-translate-y-0.5 duration-200">
                    Submit Request
                </button>
            </form>
        </div>
    </main>

    <footer class="border-t border-white/5 py-6 text-center text-xs text-zinc-400 font-medium bg-black/30 backdrop-blur-md">
        &copy; 2026 BIKUTAVISUALS. All rights reserved.
    </footer>
</body>
</html>
